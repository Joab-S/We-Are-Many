# Confere cada PR para a development: tipos, build, a suíte inteira e o jogo aberto num navegador de verdade.
name: CI

on:
  pull_request:
    branches: [development]

# Um push novo no mesmo PR cancela a rodada anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codigo:
    name: Tipos, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
      - run: npm test

  jogo:
    name: Teste de fumaça do jogo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:jogo
      # As capturas, e o rastro de quem falhou, ficam na página da rodada.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: test-results/
          retention-days: 14
