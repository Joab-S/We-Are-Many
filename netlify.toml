# Netlify: compila com Vite e publica a pasta dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/universe/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
